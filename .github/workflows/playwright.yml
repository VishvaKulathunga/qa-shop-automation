
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_USER: qashop
      DB_PASSWORD: qashop
      DB_NAME: qashop
      SANDBOX_KEY: ${{ secrets.SANDBOX_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start QA Shop services
        run: |
          curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/hasankocaman/automationexercise/main/qa-shop/docker-compose.hub.yml
          docker compose -f docker-compose.yml up -d

      - name: Wait for QA Shop API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health; then
              echo "QA Shop API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "QA Shop API did not become ready"
          docker compose -f docker-compose.yml logs
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop QA Shop services
        if: always()
        run: docker compose -f docker-compose.yml down
